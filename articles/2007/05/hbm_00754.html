<h1>finalventの日記 - 私にとってダブスタはけっこう自然な状態</h1>
<pre class="body"> イザヤ 42:20 「多くのことが目に映っても何も見えず 耳が開いているのに、何も聞こえない。」ダブスタって意味ではないかもしれませんが。私は精神的な病いもあってつい外に出して恥ずかしい思いをします。</pre>
