<h1>忘却からの帰還: &quot;ID is not anti-evolution&quot;</h1>
<pre class="body"> 進化の段階的定義 有。生物は物理法則に反しない範囲で(法則によらない)介入の「イメージを持つ」ことができる。イメージに量子がどれほど関係するというのか。瞹眛な態度の何が問題かわからない。</pre>
