<h1>格差社会って何だろう (内田樹の研究室)</h1>
<pre class="body"> 下層の人々の自律的厚生を高めること、世に難あれば一丸となれることは必要だと思う。そこから格差を憂う。「拝金主義」としか見ない者との間に壁はできた。今の私は人に省みられない無価値の策を唱えるのみ。</pre>
