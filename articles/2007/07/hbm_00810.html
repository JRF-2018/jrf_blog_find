<h1>benli: 私的使用目的の複製が自由に行える理由</h1>
<pre class="body"> 私は政治的自由のため適度な規模を以って匿名的に保持し続けることが責務だからだと思う。だから使用が制限できるようになっても私的複製ができる権利を、自由に求める人がいる価格で流通させるのが原則だと思う。</pre>
