<h1>赤の女王とお茶を - 現代のマルサス流解釈</h1>
<pre class="body"> ＞情報の増加は幾何級数をたどるが、生活資料は算術級数で増加するに過ぎない。＜「いらない「情報」などない」と叫びたい。「情報」が産まれすぎるように見えるのは省みられない「情報」が欠乏を感じているから。</pre>
