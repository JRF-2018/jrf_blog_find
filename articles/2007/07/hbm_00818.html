<h1>かさぶた。 完全に復活したゲーム超大国日本</h1>
<pre class="body"> ＞ゲームは「遊ばなければいけないもの」という思い込みが強く、その限界を突破してないからです。だから直接遊んでない無数のユーザーを「ユーザー」としてカウントできないし、なかなか利益に結びつきません。＜</pre>
