<h1>企業法務戦士の雑感 - 誰が作ったんだこんな法律。</h1>
<pre class="body"> 私的空間にある複製も８ヶ月の期間内には可能にするという産業界との暗黙の契約を示す立法でしょう。基本は「盗む」意図の立証を不要にしたいのでしょう。でも、それなら「みなす」とか入れて作文すれば良いのに。</pre>
