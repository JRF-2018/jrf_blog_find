<h1>ひらり: 文化祭の上演と著作権</h1>
<pre class="body"> 同一性侵害はない。脚本が私的翻案であっても、上演が私的翻案に留まるか実質対価請求権となる翻案権に触れるかは微妙。しかし翻案上演料が原上演料を上回るのは権利の濫用。原上演料が無料ななら無料。…と思う。</pre>
