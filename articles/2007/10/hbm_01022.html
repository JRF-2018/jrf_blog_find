<h1>映画の盗撮の防止に関する法律</h1>
<pre class="body"> 特別な空間では撮影を禁じることができ、結果として私的複製を禁じることになってもしかたがない。が、対象が著作物なら、ほぼ同等な私的バックアップを適当な期間内に提供できなければ同等物の撮影は許可される。</pre>
