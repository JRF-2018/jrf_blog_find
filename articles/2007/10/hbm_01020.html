<h1>「脳は存在しない」くらい言ってみる</h1>
<pre class="body"> ＞「脳はただの形骸であり」などと言っては、ちゃんとしすぎです。脳そのものが幻影、「そんなものわたしには見えない！」くらい図々しくなくては＜。ちゃんと…知識と機会があれば人々が接せる事実を無視しすぎ。</pre>
