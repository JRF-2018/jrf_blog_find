<h1>Neurogenesis 脳と心のお話（第一話）「心は体のどこにある？」</h1>
<pre class="body"> 心は脳の作用である。しかし、脳の思考の中でどこに心を定位させるかは昔も今も自由のはず。興奮は心臓へと影響する。心拍を意識化しようとすることに意味があったのでは？丹田や第三の眼に心理的効用はあるか？</pre>
