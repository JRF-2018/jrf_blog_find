<h1>安敦誌 : 戦争と貧困　その光と影(4)</h1>
<pre class="body"> 老いては子に従えという。しかし、老いた者を千尋の谷に落とすわけにはいかない。ほんのわずかな違いで白菜の値は変わるが、目に見えないだけで生産力は上がっているはず。老人を金策のみに追いこんではならない。</pre>
