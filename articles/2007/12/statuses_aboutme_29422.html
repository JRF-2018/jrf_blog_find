<h1>ひとこと</h1>
<pre class="body">鋭い論説を書ける人が、別に持ち出さなくても良い偏見を持ち出すのに驚く。外国が見方を造り上げるということを自分で述べているのに、それにわざわざ載っかるようなことを書くのはなぜかと邪推してしまう。
JRF 2007年12月18日</pre>
