<h1>法華経の教えってどんなんなんでしょうか？</h1>
<pre class="body"> 大乗仏教の解釈。＞心の中に、「ブッダとは何か」(…)等々の疑問が生まれるとき、人は、本来のブッダの悟りへの道へとすでに一歩踏み出していると言えるでしょう。＜そしてそこに至れない／至れるのは皆平等…？</pre>
