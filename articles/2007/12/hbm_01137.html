<h1>Anatman 2 (無我の思想　第二章　ブッダの沈黙)</h1>
<pre class="body"> 沈黙が救いだった。大きな支持を得られたという時代もあった。私もここに書かれるブッダのような人格を求めたこともあったかもしれない。現在もそれでやっていけるのか。私は「我」から逸脱しようとしているのか。</pre>
