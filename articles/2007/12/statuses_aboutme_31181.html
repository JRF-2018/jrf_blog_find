<h1>ひとこと</h1>
<pre class="body">「八方」の原義は、陰陽の四方をあわせて八方ではないか。昔は方位磁石はなく、天体により方位を見た。昼と夜で方位のはかり方に違いはあり、また方位に求められるものも昼と夜で違った。
JRF 2007年12月29日</pre>
