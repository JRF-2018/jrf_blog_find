<h1>ひとこと</h1>
<pre class="body">アラン・グリーンスパン『波乱の時代』読了。こういう本を読む機会が少ないからかもしれないが、私には落ち着いた意見が楽しめた。今後の著作で下巻の最初のような抽象的な議論がさらに深まれば興味深い。
JRF 2007年11月28日</pre>
