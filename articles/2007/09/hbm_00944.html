<h1>俺の代わり</h1>
<pre class="body"> 自分に替わる人はいない。人の業は深い。自分がやって欲しいことを替わりにやってくれる人は結局いなくなる。そこを保ったまま誰かの替わりを見つけるのは難しい。…が、どこかには居る。私には時宜を得た記事。</pre>
