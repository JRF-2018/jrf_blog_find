<h1>Tillichを通して: 「義認」の諸理解</h1>
<pre class="body"> 過去に人々が信じ悩んできた。それが我々に、どうやってか受け継がれている。恩恵？それを義しい今につなげていかなければならない。これは祈りである。そこには、気づかなくとも「自らにもとおる信仰」がある。</pre>
