<h1>EU労働法政策雑記帳: 安倍首相の大ボケ</h1>
<pre class="body"> 別に労働時間とリンクして賃金を決めろとはいわない。しかし労働時間を測っておくことは大事だし…。残業税でゆがむ程度の「制度化」のほうが問題だ。…そういえば私は時間制が何のジャマをしているのか知らない。</pre>
