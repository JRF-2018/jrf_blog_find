<h1>スラッシュドット ジャパン | YouTube、ユーザへの広告費配分を検討?</h1>
<pre class="body"> ユーザーの身分にあるものは複雑な権利処理から解放されるべきで、一定以上のコスト(CMの視聴や経路費用の負担、一定割の負担など)を払えば、それ以降は一次著作者どうしのみで争われるべきである。</pre>
