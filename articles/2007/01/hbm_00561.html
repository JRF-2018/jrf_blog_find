<h1>数学屋のメガネ - 不可知論の間違い</h1>
<pre class="body"> 「お前はここいるから心配するな」で納得してはいけない話。語り得ぬことに対して沈黙すべき…では対抗できない。他者への導きとして不適切で＞不自然な超越的視点＜であっても、不可知論も知への道程にある。</pre>
