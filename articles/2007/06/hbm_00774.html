<h1>忘却からの帰還: &quot;is-ought problem&quot;になっている？</h1>
<pre class="body"> 神が直接創造したがゆえにダメなものというのは私にはわかりにくい。このタイプは神を暴君的にとらえ神の栄光を傷付けるから、人の名誉感覚になぞらえた「べき」論が出ると考えているが…。私は創造を軽く見すぎ？</pre>
