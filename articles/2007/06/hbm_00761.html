<h1>数学屋のメガネ - 資本主義的搾取の不当性</h1>
<pre class="body"> 資本主義はまず富の集中が必要だと思うが…。元労働者の年金資金が株式投資に使われるようになった時代がゆえの意見…なわけないか。「搾取」という言葉を超克しようという試み。資金的な組合についてどう考える？</pre>
