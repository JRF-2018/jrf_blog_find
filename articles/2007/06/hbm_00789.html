<h1>カインとアベル（エピソードとその霊的意義）</h1>
<pre class="body"> ＞それには動物の血が流される必要があった＜。命の秘密が血にあると想うならそれを魔術的に使うことは一度は試みたくなる行為であり…←いや、それならアベルも魔術をしない理由はない。…魔術なのか？</pre>
