<h1>社会保障番号</h1>
<pre class="body"> ＞社会保障番号は、納税者番号より前の段階＜とするような納税者番号はやだ。民間では二人に見られたい人がそうできるようにしないとおかしなことになると思う。給付の重複除去方法は給付の性質に依るべき。</pre>
