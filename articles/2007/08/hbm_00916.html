<h1>Discommunication in Sugaya's &quot;Miracle of Love&quot; Site</h1>
<pre class="body"> 私はいつか価値ある情報を発信できるまで…とガマンし続け、やがて心の病となった。退院後、発信をしはじめ、受信のなさを思い知った。私は「心の病」を糧にして受信を続けている面がある。</pre>
