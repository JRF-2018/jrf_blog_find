<h1>ＤＶ被害者支援を志す人はマツウラマムコ著「『二次被害』は終わらない」に絶望せよ</h1>
<pre class="body"> 支援者は何人もの被害者にあっている。被害者はほぼ必然的にはじめての支援者に出会う。負の経験が支援者を臆病にし定型的な対応に追い込み、被害者はそれをうのみにする。参審員のような違う視点が必要か？</pre>
