<h1>数学屋のメガネ:天皇個人に対する偏見</h1>
<pre class="body"> 個人に対する論説にはなってないように見えるが有用な指摘。宗教はアヘンかもしれないが、多くの人がそれを信じなければやってこれなかった「痛み」の歴史をアーカイブしていることがある。安易に失うのもキケン。</pre>
