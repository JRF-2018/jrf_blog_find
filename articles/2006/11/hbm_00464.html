<h1>「水からの伝言」を信じないでください</h1>
<pre class="body"> 誰かが信念を「科学」をもって伝えようとするときがある。一度それが広まると押しとどめるのは難しい。すばらしい試み。しかし、その試みがなぜ生まれたのか。なぜこれほどまでに生まれにくいのか。それは悪か迷う</pre>
