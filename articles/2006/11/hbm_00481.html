<h1>ララビアータ:選民（その３）</h1>
<pre class="body"> 他者の中にサタンがいる。だが「我々」の中にサタンはいない。かといってサタンが神の現れでは、ベルゼブブの宗教だ。でも時代がそういう「許し」を求めることもある。〉師がいかなる意味で師であるのか〈。</pre>
