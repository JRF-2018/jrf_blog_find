<h1>charisの美学日誌 - 『聖書』を読む(3)</h1>
<pre class="body"> 私はハッピーエンドが信じられないクチです。私は友人達は「応報思想」を死していくもの(の周り)に託そうとしていると読みます。 私はどれだけ補償を受けてもヨブは苦い生を送るように想います。それが神かとも。</pre>
