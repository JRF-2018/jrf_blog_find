<pre class="body"> 「所得」格差ならまだいい。途上国の資本代替が不十分なため、先進国では「仕事があるかないか」という格差になるのが問題。そもそも、労働の誘因を維持するのにそれほど大きな格差は必要ない。リスク負担は別。</pre>
