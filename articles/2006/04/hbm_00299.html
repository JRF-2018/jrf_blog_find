<pre class="body"> サイバー刑法案なんてあったんですね。わいせつだから刑を課すってこと自体が時代錯誤な気がする。むしろ、それらは売春の一形態であるとし、風俗規制法の枠で教育や女性の人権擁護を軸に扱ったほうがいいと思う。</pre>
