<h1>共有メモ</h1>
<pre class="body">jrf&gt; (承前)

子宮墓とハイヌウェレ神話の違いは、種と種芋の違いであろう。植物体の死が残した物でも、それが精なのか実(体)なのかで信仰の形態が違ったのであろう。それが女性の神話であるのは先に挙げた理由から。栽培＝農業の開始と定住による人口限界の意識が生み出した神話なのだろう。</pre>
