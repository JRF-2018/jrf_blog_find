<h1>囲碁NHK杯…</h1>
<pre class="body">jrf&gt; 囲碁NHK杯 山下×鶴山。戦いの連続。序盤、右辺で白がダンゴになったが、白のほうがやや良いかというところ。左辺で上辺などと絡めながら激しく攻撃しあう。黒はやや抑えぎみに見える部分があったが、白さそわれた面があったか。左辺のコウ争いで白ガンバリ過ぎたか、白コウには勝ったが、右辺がボロボロに。229手で黒の中押し勝ち。</pre>
