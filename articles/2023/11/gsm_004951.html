<h1>共有メモ</h1>
<pre class="body">jrf&gt; 悪とされる心も、進化の途中で得た善い贈り物で、元来の悪はない。しかし不幸のシステムはあって、悪はなされ人は裁く。長い目で見ればそれも偶然であり、生き残る者はシステムを変えつつ和解を導くしかない。許しあわねばならないのが和解ではなく、和解は子によって実体的意志を表す。</pre>
