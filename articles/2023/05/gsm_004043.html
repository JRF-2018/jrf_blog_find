<h1>共有メモ</h1>
<pre class="body">jrf&gt; (承前)

犯人が捕まり刑がちゃんと執行されるようになると、重罰の必要性がなくなり、偶然を認める範囲が増える。偶然を認める範囲が増えるというのは、思考の広がりを意味するため、「思考・思念を深めるのが良い」の方向になり、また、応報すべき善悪を超えていくという点で、「来世がないのが良い」の方向にもなることになる。</pre>
