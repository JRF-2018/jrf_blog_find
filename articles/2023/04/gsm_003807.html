<h1>囲碁NHK杯…</h1>
<pre class="body">jrf&gt; 囲碁NHK杯 六浦×佐田。新年度の新しいセット。序盤、黒が右辺をかためて優勢かと思いきやいつの間にか白が上辺をかためて、白優勢の展開。しかし、左辺でどうも白が少し無理をしたところを、黒が見事に咎め黒優勢に。黒は慎重な打ち回しだが優位を守り、白は一応追い上げるという構図ではあった。308手完で黒の1目半勝ち。</pre>
