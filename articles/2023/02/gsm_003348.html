<h1>共有メモ</h1>
<pre class="body">jrf&gt; 従来であれば(広告なども取らず)「無償で配布」するというのは経済的に不可能だったが、現代では趣味の範囲の活動で、ブログを書くように、写真集を電子出版することが可能となっている。この点は過去に演劇等が無償で上演できたことと似ており、無償性に特別な意味を見出すべきように思う。</pre>
