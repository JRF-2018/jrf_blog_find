<h1>共有メモ</h1>
<pre class="body">jrf&gt; (承前)

カードの偽造しにくさを信頼して配給をネットワークなしでやる。というなら、複数取得だと主IDを作ってそれを使わせればいい。主IDは家で大事に保管してもらって、企業や銀行に提出したり持ち歩くのは副IDにすればいい。主IDは実印みたいな役割になる。ネットが使えるときは配給も副IDでいいので。</pre>
