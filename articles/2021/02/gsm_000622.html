<h1>囲碁NHK杯…</h1>
<pre class="body">jrf&gt; 囲碁NHK杯 張×村川。序盤、白が上辺を囲っているのに、黒は並んでいるが「厚い」とまではいえない感じ。そして、右上で手を抜きまくって振り替わりぎみになったところで、「強い手」を両者連発する展開。そして、張さんが考量時間を使う！ ただ、黒のミスが左下であったらしく、それで形勢が決まったようだった。白勝ち。</pre>
