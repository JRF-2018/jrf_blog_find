<h1>共有メモ</h1>
<pre class="body">jrf&gt; 囲碁NHK杯 山下×高尾。黒五五からはじまる。左下と上辺が白っぽくなってから、黒やるしかない感じで中央で激しい戦い。さすがに黒が勝つのは難しいかと見ていたが、かなり追い詰める。そして、左上の三々に入った段階で、解説によると地合いでも黒が良くなってきたらしい。上辺に黒がかなり食い込んで、黒の中押し勝ちとなった。すごい試合だった。</pre>
