<h1>囲碁NHK杯…</h1>
<pre class="body">jrf&gt; 囲碁NHK杯 六浦×一力。白の「今日の私の一手」で示したところから、黒、確定地は作るものの、ピンチの連続。白は右上も奪い、盤石。解説によれば途中黒が頑張っていい勝負になりかけたらしいが、「黒、凌いだのはさすがプロだが、苦しかった」が私の感想。白の中押し勝ち。</pre>
