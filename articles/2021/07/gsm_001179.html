<h1>共有メモ</h1>
<pre class="body">jrf&gt; アニメ『ぶらどらぶ』。ノリが古い！ 古すぎる。押井守が自身の古さをあえて意図的にネタにしていると感じるほど古い。が、それが実家のような安心感。私のような古い人間には超笑える。おもしろい。

調べると、2021年7月からのは「本放送」ではなく、すでに全話配信済みのようす。私はテレビで追っていくことになりそう。</pre>
