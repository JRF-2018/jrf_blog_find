<h1>共有メモ</h1>
<pre class="body">jrf&gt; 党派に属しているから、言えないことというのはあるのだろうが、党派に属しているからこそ、気づける間違いというのもあるのだと思う。逆に党派に属してないから気づける間違いがあるかというとそれはほとんどないのだろう。思考の熟練がないし、一方で、人は自然に偏りがあり党派的になるもので、党派に属さないということが不可能だろうから。</pre>
