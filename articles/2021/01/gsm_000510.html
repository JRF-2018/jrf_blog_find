<h1>parameter…</h1>
<pre class="body">jrf&gt; parameter の訳語が「母数」というのはプログラミングをやってると受け入れられないな。母集団の数を「母数」といわれたほうが納得する。…それは間違いなんだけど。

かといってパラメーターをどう訳すか。ググると「母数」の他に「助変数」や「媒介変数」がみつかるが、そちらのほうがイメージにあってる。</pre>
