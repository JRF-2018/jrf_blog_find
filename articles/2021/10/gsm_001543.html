<h1>共有メモ</h1>
<pre class="body">jrf&gt; 夕食で母の作った「肉巻き卵」がおいしかった。甘っ辛く焼いた牛肉を卵焼きで包んだもの。ただ、ググると「肉巻き卵」は卵を肉で巻いたものが出てくるがウチのはそうじゃない。昔弁当とかに入っていて好きだった。久々にやってくれておいしかった。</pre>
