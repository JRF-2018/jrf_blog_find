<h1>猫。 散歩中、猫にほとんど会わなくなった。…</h1>
<pre class="body">jrf&gt; 猫。

散歩中、猫にほとんど会わなくなった。

大きなところで、猫だまり２のあったアパートが取り壊され、当然、猫が消えた。次に、池まわりの夏ごろはいつもいた猫は見なくなった。かろうじて、猫だまり１の猫は、家にしまわれてるのが多くなったと思われるが、ときどき見るのみ。

悲しい。</pre>
