<h1>共有メモ</h1>
<pre class="body">jrf&gt; 「激怒してるのは日本人か？」という問いかけはおかしい。「激怒しているものがそれほど日本にいるのか？」とすべき。誰でも何にでも癪に障ることはありうることだから怒っている人がいてたまたまそれが日本人であってもおかしいことではない。そして怒っているからと言って日本人性を否定するのはそれはそれで差別だ。私に問題があった。ごめんなさい。</pre>
