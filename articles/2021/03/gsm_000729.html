<h1>囲碁NHK杯 決勝…</h1>
<pre class="body">jrf&gt; 囲碁NHK杯 決勝 一力×余。右下が白捨て気味で、中央から左上を狙う展開。左下で黒苦しくなるかとも思うが、白の右下が頼りなく一方的にならない。解説によると白がいいというところで、上辺でミスのようなものがあったらしく、黒が地で上回った様子。黒の中押し勝ち。一力さん優勝。</pre>
