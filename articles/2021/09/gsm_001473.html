<h1>共有メモ</h1>
<pre class="body">jrf&gt; 囲碁NHK杯 六浦×羽根。見どころの多い対局だった。左上で戦いになり、白がうまい手を打ったと思ったら、黒凌ぐ。白上辺で危ないと思ったが、逆に白が黒を取る。しかし、下辺で黒が白を攻め、解説では黒も最善という感じではないがコウになり、白がコウを解消するものの、地合いで黒有利。黒ちゃんと寄せて、246手完 4目半で黒の勝ち。</pre>
