<h1>オーディオの設定。…</h1>
<pre class="body">jrf&gt; オーディオの設定。

スピーカー台とその下の人工大理石ボードの間に挟んでいたゴムシートを取り外した。スピーカー台に置いていたダンベルも当然取り外す。

低音のメカニカルな動きはゴムシートがあったほうがよいが、アタック音の力強さと音の伸びはゴムシートを外したほうがよい感じだったので。</pre>
