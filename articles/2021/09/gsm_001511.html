<h1>共有メモ</h1>
<pre class="body">jrf&gt; 昨年の右肩に続き、今年は左肩が五十肩に。症状としては、腕に体重をかけたり背中に手を回そうとすると痛む…とか。確定診断をもらうためだけに医者に行った。治療は痛み止めをもらったりリハビリしたりがメインで基本は時間が解決系。注射で痛みが半減することもあるらしいが、糖尿病のため今年は打ってもらえなかった。</pre>
