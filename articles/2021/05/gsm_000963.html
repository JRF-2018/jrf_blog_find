<h1>『永谷園…</h1>
<pre class="body">jrf&gt; 『永谷園 広東風かに玉』に母がシイタケとタケノコを足したもの…とてもおいしかった。いっしょに何度か言及した、かつおのたたき(ネギ、土生姜、にんにく…と薬味をいっぱいかけ血合いを取ったもの)もあって、「こんな贅沢していいのかなぁ」と思いつつ食べた。かつおももちろんうまかった。素材は安くて手間はかからないらしいんだけどね。</pre>
