<h1>共有メモ</h1>
<pre class="body">jrf&gt; 左肩の五十肩どんどんヒドくなる。重い物を持つのも、髪を洗うのも、トイレで尻を拭くのも辛くなってきた。少し前は平気だったのに。寝るとき抑えてないのにじわじわ痛いこともあるようになった。昨年の右肩はここまでじゃなかったはず。今年は糖尿で注射打ってもらえなかったのが効いてるのかなぁ…。</pre>
