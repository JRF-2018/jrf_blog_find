<h1>共有メモ</h1>
<pre class="body">jrf&gt; 特に指導層の男女数割り当ての「パリテ」を私は推す。それが国際的競争力を削ぐからと言って、関税でも導入できるかというと難しい。しかし、難しいからといって他を探ると、実質的競争力担保のためにフェミニストによるスパイ的活動を是認するという話になりかねない。やはり、それよりは関税(同盟)のほうがフェアでそちらを目指すべきなのだろう。</pre>
