<h1>ひとこと</h1>
<pre class="body">「敵」？…。誰かを敵とするというよりも、私個人がその方向を内に秘めていること、「内面の敵」に留意する。…いや、この違和感はそういうことじゃないな。「生きていていいんですか？」という情況の私に、敵も何も建てるに甲斐はない。
JRF 2009年1月2日</pre>
