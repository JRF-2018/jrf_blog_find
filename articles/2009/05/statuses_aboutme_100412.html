<h1>ひとこと</h1>
<pre class="body">今、必要な労働とは必ずしも違うんだけど、何かのリスクが顕在化したときや、(老いて)就労者が少なくなったときに備えて、技術承継のための訓練を受ける。その技能を維持するためだけに(断続的に)仕事をこなしておく。
JRF 2009年5月7日</pre>
