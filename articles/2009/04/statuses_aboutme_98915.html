<h1>ひとこと</h1>
<pre class="body">法律学小辞典によると「結果責任」とは＞歴史的に過失責任主義成立以前の，加害者が故意・過失の有無にかかわらず，損害発生の結果に対して賠償責任を負った時代の責任をいうことが少なくない。＜
JRF 2009年4月17日</pre>
