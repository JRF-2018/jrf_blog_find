<h1>共有メモ</h1>
<pre class="body">jrf&gt; [承前]

「平等」をどう導くか。

「来世がないのが良い」から「執着がないのが良い」が導ける。カーストなどの身分制度が転生概念とともにあると、上の身分になろう、下の身分にならないようにしようとこだわる執着を生む。身分がなければそれもない…として「平等が良い」を導けばよいのではないか。</pre>
