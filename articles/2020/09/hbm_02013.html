<h1>烏龍茶は水割りがおいしい :: デイリーポータルZ</h1>
<pre class="body"> 普段は水で薄めて烏龍茶を飲むけど、それは普段は慣れておいてイザ「欲しい」と感じたときの効果を残すため(個人の感想)。倍ビッグマックを食べた後とか、薄めてない烏龍茶を大量に飲む。基本、薄めないほうが好き。</pre>
