<h1>ひとこと</h1>
<pre class="body">夜どうもかゆいな、昨日部屋で見た蚊かな…と思ったが、昼になって、鼻みず、クシャミが出だした。そういえばそろそろ私にとっての花粉症の季節…。昨年は軽かったが今年はどうなるのだろう？
JRF 2010年4月14日</pre>
