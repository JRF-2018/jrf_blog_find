<h1>ひとこと</h1>
<pre class="body">あっと、typo。節と説。「信奉する」を「信望する」と間違えたのも気になってるんだよな。でも、あれはアリだとも思える。そこを違うとこだわりたいのは、信と望の二語が別の意味(信用と人望)があるからか。
JRF 2008年9月4日</pre>
