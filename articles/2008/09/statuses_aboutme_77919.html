<h1>ひとこと</h1>
<pre class="body">今の私は「道を解く」と書きたい気分だ。私は話しながら、書きながら、そうでないかと解いていってるのだ。もちろん、普段からこう書けば、道は数学のように解くものという誤解を生むことになるのでよろしくはない。
JRF 2008年9月6日</pre>
