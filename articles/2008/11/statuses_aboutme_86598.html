<h1>ひとこと</h1>
<pre class="body">「伝道」の節。＞私にとって興味があったのは、ある思想の「伝道」が本当に日本人を変え、日本の歴史を一転させた例が過去にあった＜。それは＞朱子学＜の＞絶対的正統主義や、それを基とした個人の絶対的規範＜。
JRF 2008年11月6日</pre>
