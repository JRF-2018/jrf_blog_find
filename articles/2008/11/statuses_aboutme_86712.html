<h1>ひとこと</h1>
<pre class="body">「API」の日本語訳は「尺貫」でいいんじゃなかろうか。物を統一した「尺貫」で用意することで、再利用を促す、というあたりで。あとおとが「借款」と同じで一時的に間借りするような雰囲気も出る。
JRF 2008年11月7日</pre>
