<h1>ひとこと</h1>
<pre class="body">「これぐらいなら／このままなら、大丈夫だろう」の「これ」「この」の内部にはゾッとするものが含まれうる。その私への表出を私は捉えられない、捉えても心に留められない、今きっとそうであるだろう。私は何を見過ごしにしましたか。
JRF 2008年8月26日</pre>
