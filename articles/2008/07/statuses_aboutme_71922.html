<h1>ひとこと</h1>
<pre class="body">私が何かを気付くことに意味があるだろうか。あたり前に意味がある。私にとって意味があれば、それで悩む必要はない。もちろん、一人一人が気付くことは、以前に誰かも気付いているということでほぼ間違いない。
JRF 2008年7月28日</pre>
