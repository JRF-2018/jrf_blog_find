<h1>ひとこと</h1>
<pre class="body">何かを見えないはずの「私」が気付くようになる。ああ、それはきっと「私」でなくても誰かが気付くようになったということなのだ。そういう社会の変化の芽の一つが「私」というところに萌え出ただけなのだ。
JRF 2008年7月28日</pre>
