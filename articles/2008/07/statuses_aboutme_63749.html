<h1>ひとこと</h1>
<pre class="body">街は結構人がいた。物価上昇があるべき反応を呼んでいるのかなと思った。これですぐに景気が良くなるとは言わないけど、20代かそれ以下の人が渋いお店にいて、ここから意外に「世代交代」がすすむのかな、とか思った。
JRF 2008年7月4日</pre>
