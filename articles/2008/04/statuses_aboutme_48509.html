<h1>ひとこと</h1>
<pre class="body">表現の自由の問題は、実際にはその背後にある力関係によってほとんど一方的な物言いができることにある。だから、問題は、ほんとうは表現の自由にあるのではなく、「背後にある力関係にある」。……これは半分うそだ。
JRF 2008年4月4日</pre>
