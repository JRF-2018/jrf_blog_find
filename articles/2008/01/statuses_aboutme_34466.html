<h1>ひとこと</h1>
<pre class="body">他の人の書いた文章の間に明らかに違う文体で書かれた自分の文章を読んだ。どこにあるかを想定せず読んだので不意に、それゆえ客観的に読めた。なんていうか、私は「障害」のある人なんだなぁというのがよくわかった。
JRF 2008年1月18日</pre>
