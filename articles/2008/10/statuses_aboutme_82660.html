<h1>ひとこと</h1>
<pre class="body">根拠のない懲戒請求はいけないという話だったようだが、橋下氏自身は請求を出さなかったので根拠があるかどうかは直接的には関係なく、請求を出した者は橋下氏が言ったことに自分もそう感じたということで根拠がないとまではいえない。
JRF 2008年10月4日</pre>
