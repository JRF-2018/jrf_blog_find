<h1>共有メモ</h1>
<pre class="body">jrf&gt; 『「シミュレーション仏教」の試み』の枠組みでは、消費が人口や資産からの収益に絡んで、その多寡により、これも死蔵資産割合に影響するのだろう。農業の出来も、消費に影響する感じか。ただ、そうなるのは、株式や債券などのすべての資産の金利が固定されているので、死蔵資産割合で金利の変化を表さざるを得ないからだろう。</pre>
