<h1>共有メモ</h1>
<pre class="body">jrf&gt; 結跏趺坐に憧れての半跏趺坐と正座の練習。正座、コツ(?)を掴んだ。半跏趺坐と同じく座布団を折ってかなり高くして尻とかかとの間に挟むのがコツ。すると、これまでと違ってちゃんと座れてる感じがする。変なりきみやツラさがほぼない。ただ、座布団が必須となったわけで、ちゃんとした正座の前に壁ができた感じで、見通しは暗く道は遠い。</pre>
