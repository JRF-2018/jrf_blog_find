<h1>囲碁NHK杯…</h1>
<pre class="body">jrf&gt; 囲碁NHK杯 林×広瀬。序盤、右上、右辺と白が小さく生きて、黒に地は少なく、模様はあるが作らされている感じであまり夢がない展開。それでも下辺で黒が広げて中央に黒地が大きく付きそうになって、しかし、白は左上から上辺で大きく地を取り、下辺は微妙なところだったが、白が捨ててどうなるかといったところ。258手完で白の4目半勝ち。</pre>
