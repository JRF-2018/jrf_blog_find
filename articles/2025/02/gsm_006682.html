<h1>共有メモ</h1>
<pre class="body">jrf&gt; 氷河期世代。私がそれにあたるかは微妙なところだけど、下々から見た感想として、氷河期世代より上の方も転職市場などで、苦しみを味わっている方がかなりいた。転職が称揚された時代で、それに乗っからざるを得なかった人も。氷河期世代だけが苦しかったわけではない…という点はほんとだと思う。</pre>
