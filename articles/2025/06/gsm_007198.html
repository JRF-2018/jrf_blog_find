<h1>共有メモ</h1>
<pre class="body">jrf&gt; ただし、KG。運転やちょっとしたゲームなどの状況を整理するには良いと思うが、状況に時間的流れがある普通の文章に適用しようとすると、複雑になりすぎる問題があると思う。そのような場合、基本的には登場人物の関係を覚えるといった、補助知識にのみ有効に使えるだけではないか。運転やゲームなど全面的に使って有効な場面もあるだろうけど。</pre>
