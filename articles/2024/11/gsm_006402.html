<h1>共有メモ</h1>
<pre class="body">jrf&gt; 囲碁NHK杯 伊田×依田。最序盤、上辺で黒が地を取り、白が厚み。左下から左辺に行って、解説によると、黒の左下は固い…というところから、どうもミスをしたらしく、形勢はやや白に。しかし、その後、どうも白が固く打ちすぎたらしく、上辺の黒の出に対応できず、黒優勢に。黒押し切って、240手完で黒の4目半勝ち。</pre>
