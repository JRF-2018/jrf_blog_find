<h1>囲碁NHK杯…</h1>
<pre class="body">jrf&gt; 囲碁NHK杯 本木×許。後半の激しさを予想させるような石を裂き合う序盤。中盤に左上で長いコウ争いとなり、黒が左上でコウ材を多く作ったところで、黒がうまく打ったらしい。しかし、コウを黒が解消したところで、AI は黒の評価をやや下げる。接戦の模様。最後まで AI の評価が揺れ動く中、終局。345手完で黒の半目勝ち。</pre>
