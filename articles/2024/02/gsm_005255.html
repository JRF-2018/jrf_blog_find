<h1>共有メモ</h1>
<pre class="body">jrf&gt; 権力批判というのは、自分達は権力者にすりよって甘い汁を吸えるよう、批判させることで権力者から遠ざけ、権力を「理解」する者を少数者にするためにあるんだろうな。だって、左派政権とかできれば、権力批判すら許されなくなるから。権力批判の想起は自由な社会でのシノギのやり方なのだろう。</pre>
