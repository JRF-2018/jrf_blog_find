<h1>共有メモ</h1>
<pre class="body">jrf&gt; 国際芸術祭「あいちトリエンナーレ2019」の企画展「表現の不自由展・その後」が開幕から3日目の8月3日に中止された問題。表現がどうあれ、7月18日の京アニ放火殺人事件の直後でのテロ警戒での判断は正しかったと思う。銃撃犯などはあったが、あれほど大規模テロに警戒すべきだった時期はその後ない。</pre>
