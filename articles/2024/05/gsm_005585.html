<h1>共有メモ</h1>
<pre class="body">jrf&gt; (承前)

「不労所得者の勉強」が足りないのかもしれない。不労所得者が海外での収入で日本で生活しようと思えばそれは円高圧力になる。それがないのは、日本の大学の力を削りすぎて、博士課程が魅力的でなくなり、不労所得者の子弟が国内で勉強できないのが問題なのかもしれない。</pre>
