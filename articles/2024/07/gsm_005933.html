<h1>共有メモ</h1>
<pre class="body">jrf&gt; アサクリ問題の黒人奴隷問題。「奴隷」という言葉の何がいけないかというと、それ(奉公人など)が当時の日本では一般的な雇用形態であって、特別に黒人のみ「奴隷」としたことではないこと。その点で誤解が生じないように、むしろ「奴隷」という言葉は避けるべきだと思う。海外に売られた奴隷は別の契約形態になるため話が別。</pre>
