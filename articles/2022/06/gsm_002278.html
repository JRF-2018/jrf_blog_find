<h1>共有メモ</h1>
<pre class="body">jrf&gt; ネコ。

散歩中、久々に池周りのネコに遭遇しうれしくなる。「久しぶり」と声かけちゃった。夏になり朝散歩するようになって、それで久々に時間があったということだと思う。

一方、猫だまり２の白茶のネコは姿を見なくなった。高齢そうだったし、いつもいっしょにいた黒猫二匹はいるので、そういうことだと思う。悲しい。</pre>
