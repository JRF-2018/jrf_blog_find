<h1>共有メモ</h1>
<pre class="body">jrf&gt; 新型コロナ騒ぎで、飲食店や旅館などでマジメなところほど借金に苦しんでいる。だから、インフレに倒して借金の重荷を軽くする必要がある。すると、債権を持ってる高齢者が苦しくなる。少なくとも年金の調整は必要となり、すると国庫が苦しくなる。…それと資産所得倍増がどうからむのか…。</pre>
