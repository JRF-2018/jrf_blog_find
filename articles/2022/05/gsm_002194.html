<h1>囲碁NHK杯…</h1>
<pre class="body">jrf&gt; 囲碁NHK杯 安達×伊田。白が大高目の目外しではじめる。それが決まって下辺に白が威張り、しかし、右辺では黒が大きく囲うという展開。AI は白有利に傾くが、解説者によると大きな差はないとのこと。実際、AI の数値は敏感に反応する。最後まで白は下辺でがんばりきり、黒は及ばなかった。216手完で白の3目半勝ち。</pre>
