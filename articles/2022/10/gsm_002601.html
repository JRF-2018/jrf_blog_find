<h1>共有メモ</h1>
<pre class="body">jrf&gt; 中絶に配偶者の同意が必要という問題。同意を得る努力をして得られなくても保健機関などの助言を受ければ同意なく中絶できる…とかでいいと思う。しかし、この問題も、医師に男性のことを知らせる必要をなくすという点で、この前の野球選手とか一部男性に有利でそれに強制される女性の多数に不利になる方向に思う。</pre>
